    <style>
      :root {
        --color-bg: #05040a;
        --color-primary: #c084fc; /* Celestial Lavender */
        --color-secondary: #8b5cf6; /* Royal Violet */
        --color-accent: #e2c57b; /* Refined Champagne Gold */
        --color-text: #f3f4f6; /* Crisp Ivory Text */
        --color-panel: rgba(10, 8, 22, 0.9); /* Dark Nebula Glass Panel */
        --font-serif: 'Playfair Display', 'Georgia', serif;
        --font-sans: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
        --font-display: 'Space Grotesk', 'Cinzel', serif;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        background-image: radial-gradient(circle at 50% 40%, #0d0924 0%, #030208 100%);
      }

      h1, h2, h3, button {
        font-family: var(--font-display);
        text-shadow: 0 0 5px rgba(192, 132, 252, 0.3);
      }

      /* Global Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-secondary);
        border: 1px solid var(--color-primary);
        border-radius: 4px;
      }

      /* CRT / Mystical Grain Effect */
      .mystical-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMDAwIiAvPgo8cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjMjIyIiBvcGFjaXR5PSIwLjEiIC8+Cjwvc3ZnPg==');
        pointer-events: none;
        z-index: 9999;
        opacity: 0.2;
      }
      
      /* Fade In Animation */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .fade-in {
        animation: fadeIn 1s ease-in-out;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes slowSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes mysticalPulse {
          0% { box-shadow: 0 0 15px rgba(192, 132, 252, 0.2) inset; opacity: 0.8; }
          50% { box-shadow: 0 0 30px rgba(192, 132, 252, 0.5) inset; opacity: 1; }
          100% { box-shadow: 0 0 15px rgba(192, 132, 252, 0.2) inset; opacity: 0.8; }
      }
      
      .mystical-scan-frame {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          border: 2px solid var(--color-primary);
          border-radius: 50% 50% 45% 45%; /* Face/Palm shape */
          animation: mysticalPulse 3s infinite;
          box-shadow: 0 0 20px var(--color-primary);
          z-index: 10;
      }

      /* --- Product Detail Responsive Layout --- */
      .product-detail-container {
          display: flex;
          flex-direction: row;
          gap: 40px;
          align-items: center;
          justify-content: center;
          padding: 40px;
          width: 100%;
          box-sizing: border-box;
      }
      .product-detail-image {
          flex: 1;
          width: 50%;
          max-width: 500px;
          display: flex;
          justify-content: center;
      }
      .product-detail-content {
          flex: 1;
          width: 50%;
          text-align: left;
          display: flex;
          flex-direction: column;
          gap: 15px;
      }
      .product-detail-buttons {
          display: flex; 
          gap: 20px; 
          justify-content: flex-start;
          margin-top: 30px; 
          flex-wrap: wrap;
      }
      
      /* --- Home Page Cards Layout --- */
      .home-cards-container {
          display: flex;
          gap: 30px;
          flex-wrap: wrap;
          justify-content: center;
          margin-top: 20px;
          width: 100%;
      }

      /* --- Responsive Utilities --- */
      .desktop-only { display: block; }
      .mobile-only { display: none; }

      /* Responsive Navbar Defaults */
      .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        width: 100%;
        box-sizing: border-box;
      }

      .desktop-nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .mobile-menu-btn {
        display: none !important;
      }

      .mobile-nav-controls {
        display: none !important;
      }

      .mobile-dropdown-menu {
        display: none;
      }

      /* Responsive Grid for How It Works */
      .feature-grid {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 30px;
      }

      /* Tablet Adjustments (768px - 1024px) */
      @media (max-width: 1024px) and (min-width: 769px) {
        .nav-container {
          padding: 0.85rem 1.25rem !important;
        }
        .desktop-nav-links {
          gap: 12px !important;
          font-size: 0.9rem !important;
        }
        .home-cards-container {
          gap: 20px !important;
        }
      }

      /* Mobile Adjustments (<= 900px) */
      @media (max-width: 900px) {
        .nav-container {
          display: flex !important;
          flex-direction: row !important;
          flex-wrap: nowrap !important;
          justify-content: space-between !important;
          align-items: center !important;
          padding: 0.5rem 0.65rem !important;
          width: 100% !important;
          box-sizing: border-box !important;
          gap: 6px !important;
        }
        
        /* MENU Button on Mobile is explicitly positioned on the FAR LEFT */
        .mobile-menu-btn {
          display: flex !important;
          align-items: center !important;
          gap: 4px !important;
          order: 1 !important;
          flex-shrink: 0 !important;
          white-space: nowrap !important;
          padding: 4px 8px !important;
          font-size: 0.8rem !important;
        }

        .nav-logo {
          display: flex !important;
          align-items: center !important;
          gap: 4px !important;
          font-size: 0.88rem !important;
          order: 2 !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
          max-width: 130px !important;
          flex-shrink: 1 !important;
        }

        .desktop-nav-links {
          display: none !important;
        }

        .mobile-nav-controls {
          display: flex !important;
          align-items: center !important;
          gap: 4px !important;
          order: 3 !important;
          flex-shrink: 0 !important;
          white-space: nowrap !important;
        }

        .mobile-dropdown-menu {
          display: flex !important;
          flex-direction: column !important;
          background: rgba(10, 8, 22, 0.98) !important;
          border-top: 1px solid rgba(212, 175, 55, 0.3) !important;
          border-bottom: 1px solid rgba(212, 175, 55, 0.3) !important;
          padding: 12px 16px !important;
          gap: 10px !important;
          width: 100% !important;
          box-sizing: border-box !important;
          backdrop-filter: blur(12px) !important;
        }

        .feature-grid {
          flex-direction: column;
          align-items: center;
        }

        h1 { font-size: 1.8rem !important; }
        p { font-size: 0.95rem !important; }
        
        .glass-panel-mobile {
          width: 94% !important;
          padding: 1.25rem 1rem !important;
          margin: 0 auto;
          box-sizing: border-box !important;
        }

        .result-container-mobile {
          padding: 1.25rem 0.85rem !important;
        }

        .desktop-only { display: none !important; }
        .mobile-only { display: block !important; }
        .hide-on-mobile-instant-fate { display: none !important; }
        
        /* Product Modal Mobile Layout Switch */
        .product-detail-container {
            flex-direction: column !important;
            padding: 16px !important;
            gap: 20px !important;
        }
        .product-detail-image, .product-detail-content {
            width: 100% !important;
            max-width: 100% !important;
            text-align: center !important;
            align-items: center !important;
        }
        .product-detail-buttons {
            justify-content: center !important;
        }
      }
      
      /* Stripe Element Styling */
      .StripeElement {
        box-sizing: border-box;
        height: 40px;
        padding: 10px 12px;
        border: 1px solid #8a6e2f;
        border-radius: 4px;
        background-color: rgba(0,0,0,0.3);
        box-shadow: 0 1px 3px 0 #e6ebf1;
        -webkit-transition: box-shadow 150ms ease;
        transition: box-shadow 150ms ease;
        color: #fff;
      }
      .StripeElement--focus {
        box-shadow: 0 1px 3px 0 #cfd7df;
      }
      .StripeElement--invalid {
        border-color: #fa755a;
      }
      .StripeElement--webkit-autofill {
        background-color: #fefde5 !important;
      }
